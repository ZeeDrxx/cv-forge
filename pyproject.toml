[project]
name = "cv-forge"
version = "0.1.0"
description = "One YAML source, many targeted LaTeX CVs (EN/FR, general / internship / master's variants)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cvforge = "cvforge.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
