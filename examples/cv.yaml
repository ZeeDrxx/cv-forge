# Example CV Forge source. Every fact lives here once.
# A string is used for every language; a {en: …, fr: …} mapping is translated.
# `tags` limits an item to some variants; an item without tags appears everywhere.

profile:
  name: Sam Rivera
  headline:
    en: Software engineering student — data & backend
    fr: Élève ingénieur logiciel — data & backend
  email: sam.rivera@example.com
  phone: "+33 6 00 00 00 00"
  location: Lyon, France
  links:
    - { label: github.com/sam-rivera, url: "https://github.com/sam-rivera" }
    - { label: sam-rivera.dev, url: "https://sam-rivera.dev" }

variants:
  general:
    sections: [summary, experience, projects, education, skills, languages]
  internship:          # end-of-studies internship (PFE) applications
    headline:
      en: Looking for a 6-month end-of-studies internship — from February 2027
      fr: Recherche un stage de fin d'études de 6 mois — à partir de février 2027
    sections: [summary, experience, projects, skills, education, languages]
