name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: cvforge validate examples/cv.yaml

  pdf:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every example CV in Docker (Tectonic)
        run: docker compose run --rm cvforge build examples/cv.yaml --overleaf
      - uses: actions/upload-artifact@v4
        with:
          name: example-cvs
          path: |
            build/*.pdf
            build/*.overleaf.zip
